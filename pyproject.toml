[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deep-space-music-player"
version = "4.0.1"
description = "Тёмный полупрозрачный музыкальный плеер для Windows 11 на Python (PySide6)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Deep Space Player"}
]
dependencies = [
    "PySide6>=6.6",
    "mutagen>=1.47",
    "numpy>=1.24",
    "scipy>=1.10",
    "pydub>=0.25.1",
    "librosa>=0.10",
    "pypresence>=4.3.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pytest>=7.0",
    "pytest-qt>=4.0",
]

[project.scripts]
deep-space-player = "music_player:main"

[tool.setuptools]
# Плоская раскладка: явный список, чтобы setuptools не принял
# tests/ и файлы в корне за пакеты ("Multiple top-level packages").
packages = ["ui", "styles"]
py-modules = ["music_player", "audio_engine", "online_services"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "TCH"]
# N802/N815 — Qt-соглашения об именовании: переопределения методов (paintEvent,
# closeEvent) и сигналы (positionChanged) обязаны быть camelCase, переименовать их нельзя.
ignore = ["E501", "N802", "N815"]

[tool.ruff.lint.per-file-ignores]
# N806: Win32-константы (WCA_ACCENT_POLICY и т.п.) по конвенции UPPER_CASE,
# хотя находятся в теле функции.
"ui/widgets.py" = ["N806"]

[tool.pytest.ini_options]
testpaths = ["tests"]
